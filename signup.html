<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Store - Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
        }

        .navbar {
            background-color: #111827;
            padding: 18px 0;
        }

        .navbar-brand {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #4a90e2;
        }

        .signup-section {
            padding: 50px 15px;
        }

        .signup-box {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .signup-box h1 {
            text-align: center;
            color: #0d47a1;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: bold;
        }

        .signup-btn {
            width: 100%;
            background-color: #0d47a1;
            color: white;
            padding: 12px;
            border: none;
            font-weight: bold;
            margin-top: 10px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #0d47a1;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            background-color: #111827;
            color: white;
            padding: 25px;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="index.html">BMW STORE</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="models.html">Models</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </div>
</nav>

<section class="signup-section">

    <div class="signup-box">

        <h1>Create Account</h1>

        <form action="#" method="post">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input
                        type="text"
                        class="form-control"
                        placeholder="Enter first name"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input
                        type="text"
                        class="form-control"
                        placeholder="Enter last name"
                        required>
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input
                    type="tel"
                    class="form-control"
                    placeholder="Enter phone number"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input
                    type="date"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label>

                <div>
                    <input type="radio" name="gender" value="male" required>
                    Male

                    <input type="radio" name="gender" value="female" class="ms-3">
                    Female

                    <input type="radio" name="gender" value="other" class="ms-3">
                    Other
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    placeholder="Create a password"
                    minlength="6"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input
                    type="password"
                    class="form-control"
                    placeholder="Confirm your password"
                    minlength="6"
                    required>
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>

    </div>

</section>

<footer class="text-center">
    <p class="mb-0">© 2026 BMW Store. All Rights Reserved.</p>
</footer>

</body>
</html>
