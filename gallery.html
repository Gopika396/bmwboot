<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Store - Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .navbar {
            background-color: #111827;
            padding: 18px 0;
        }

        .navbar-brand {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #4a90e2;
        }

        .gallery-header {
            background-color: #0d47a1;
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .gallery-header h1 {
            font-size: 48px;
            font-weight: bold;
        }

        .gallery-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }

        .gallery-img:hover {
            transform: scale(1.02);
        }

        footer {
            background-color: #111827;
            color: white;
            padding: 40px 0 20px;
            margin-top: 60px;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="index.html">BMW STORE</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="models.html">Models</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </div>
</nav>

<section class="gallery-header">
    <h1>BMW Gallery</h1>
    <p>Explore the beauty and performance of BMW automobiles.</p>
</section>

<section class="container my-5">

    <div class="row g-4">

        <div class="col-md-4">
            <img src="m3.jpg" alt="BMW M3" class="gallery-img">
        </div>

        <div class="col-md-4">
            <img src="bmw5.jpg" alt="BMW X5" class="gallery-img">
        </div>

        <div class="col-md-4">
            <img src="i8.jpg" alt="BMW i8" class="gallery-img">
        </div>

        <div class="col-md-4">
            <img src="m4.jpg" alt="BMW M4" class="gallery-img">
        </div>

        <div class="col-md-4">
            <img src="x7.jpg" alt="BMW X7" class="gallery-img">
        </div>

        <div class="col-md-4">
            <img src="i7.jpg" alt="BMW i7" class="gallery-img">
        </div>

    </div>

</section>

<footer>
    <div class="container text-center">
        <h4>BMW STORE</h4>
        <p>Luxury. Performance. Innovation.</p>
        <p class="mb-0">© 2026 BMW Store. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>
