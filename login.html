<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Store - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
        }

        .navbar {
            background-color: #111827;
            padding: 18px 0;
        }

        .navbar-brand {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #4a90e2;
        }

        .login-section {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background-color: white;
            width: 420px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .login-box h1 {
            text-align: center;
            color: #0d47a1;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: bold;
        }

        .login-btn {
            width: 100%;
            background-color: #0d47a1;
            color: white;
            padding: 12px;
            border: none;
            font-weight: bold;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            color: #0d47a1;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            background-color: #111827;
            color: white;
            padding: 25px;
        }

        
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="index.html">BMW STORE</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="models.html">Models</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </div>
</nav>

<section class="login-section">

    <div class="login-box">

        <h1>Login</h1>

        <form action="#" method="post">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                    minlength="6">
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="signup-link">
            <p>
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>
        </div>

    </div>

</section>

<footer class="text-center">
    <p class="mb-0">© 2026 BMW Store. All Rights Reserved.</p>
</footer>

</body>
</html>
